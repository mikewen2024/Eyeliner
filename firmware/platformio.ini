; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; Settings shared by every environment
[env]
; DShotRMT uses the ESP-IDF 5.x RMT driver (driver/rmt_tx.h), which requires
; Arduino-ESP32 core 3.x. The official "espressif32" platform is stuck on core
; 2.x, so use the community-maintained pioarduino platform instead.
; 55.03.312 = Arduino-ESP32 3.3.12 / ESP-IDF 5.5. Requires PlatformIO Core >= 6.2.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

; lib/rotation_sensing is a clone of ESP-IDF projects (with committed build/
; trees containing dangling symlinks), not a PlatformIO library. Keep the LDF
; away from it; a stub library.json in that folder stops the source scan.
lib_ignore = rotation_sensing

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Port is auto-detected. On macOS the XIAO shows up as /dev/cu.usbmodem*
; (use cu.*, not tty.*). Uncomment to pin it if more than one board is plugged in.
; upload_port = /dev/cu.usbmodem*
; monitor_port = /dev/cu.usbmodem*

; Main firmware: ESP-IDF (no Arduino). Entry point is app_main() in src/main.c.
; Sources are listed in src/CMakeLists.txt; IDF options in sdkconfig.defaults.
; Only lsm6dsv320x-pid from ./lib is used here; AlfredoCRSF, DShotRMT and
; AlfredoDShot are Arduino libraries and are only usable from Arduino envs.
[env:xiao_esp32s3]
framework = espidf
build_src_filter = +<*> -<tests/>

; Dual LSM6DSV320X test over hardware I2C at 1 MHz (src/tests/test_lsm6dsv.cpp)
;   pio run -e test_lsm6dsv -t upload && pio device monitor -e test_lsm6dsv
; Pins default to include/board_pins.h; override any LSM_* macro here.
[env:test_lsm6dsv]
build_src_filter = +<tests/test_lsm6dsv.cpp>
build_flags =
;    -D LSM_ADDR_A=0x6A            ; set either to -1 for a single IMU
;    -D LSM_ADDR_B=0x6B
;    -D LSM_I2C_FREQ_HZ=400000     ; default 1 MHz (FM+)
;    -D LSM_XL_ODR=LSM6DSV320X_ODR_AT_960Hz   ; default 480 Hz; change all four together
;    -D LSM_GY_ODR=LSM6DSV320X_ODR_AT_960Hz
;    -D LSM_HG_ODR=LSM6DSV320X_HG_XL_ODR_AT_960Hz
;    -D LSM_ODR_HZ=960.0f
;    -D LSM_INT_OPEN_DRAIN=0       ; 1 = open-drain (default, needed on the shared INT)
;    -D LSM_INT_ACTIVE_LOW=0       ; 1 = active-low (default)

; LSM6DSV320X over hardware SPI at 10 MHz, max ODR (src/tests/test_lsm6dsv_spi.cpp)
;   pio run -e test_lsm6dsv_spi -t upload && pio device monitor -e test_lsm6dsv_spi
; Self-contained: pins/settings are defined in the .cpp, not board_pins.h.
; The IMU's CS must be driven (not tied to 3V3) and SDO/SA0 wired to MISO.
[env:test_lsm6dsv_spi]
build_src_filter = +<tests/test_lsm6dsv_spi.cpp>
build_flags =
;    -D LSM_SPI_SCK_PIN=7          ; D8  (defaults: XIAO labelled SPI pins)
;    -D LSM_SPI_MOSI_PIN=9         ; D10
;    -D LSM_SPI_MISO_PIN=8         ; D9
;    -D LSM_SPI_CS_PIN=44          ; D7
;    -D LSM_SPI_INT_PIN=3          ; D2
;    -D LSM_SPI_CLOCK_HZ=10000000  ; max 10 MHz
;    -D LSM_SPI_MODE=3             ; 0 or 3
;    -D LSM_SPI_USE_INT=1          ; 0 = poll STATUS (default), 1 = read on INT1
;    -D LSM_SPI_INT_OPEN_DRAIN=0   ; 1 = open-drain (default), 0 = push-pull
;    -D LSM_SPI_INT_ACTIVE_LOW=0   ; 1 = active-low (default), 0 = active-high

; I2C line diagnostic (src/tests/diag_i2c_lines.cpp): checks SDA/SCL can be
; pulled low, reads INT, and bit-bang probes addresses without the I2C peripheral.
; Runs at boot and again on any key sent over serial.
;   pio run -e diag_i2c_lines -t upload && pio device monitor -e diag_i2c_lines
[env:diag_i2c_lines]
build_src_filter = +<tests/diag_i2c_lines.cpp>
build_flags =
;    -D DIAG_SDA_PIN=2             ; defaults from board_pins.h
;    -D DIAG_SCL_PIN=1
;    -D DIAG_MUX_SEL_PIN=41        ; drive the mux select (default: not driven)
;    -D DIAG_MUX_SEL_LEVEL=0       ; 0 = IMUs, 1 = external I2C connector

; DShot600 arming/throttle test against one AM32 ESC (src/tests/test_dshot.cpp)
; using lib/AlfredoDShot. Streams zero throttle until AM32 arms (~1.2 s), then
; takes signed 3D-mode throttle over serial; reads AM32 serial telemetry on
; DSHOT_TELEM_PIN.
;   pio run -e test_dshot -t upload && pio device monitor -e test_dshot
[env:test_dshot]
build_src_filter = +<tests/test_dshot.cpp>
build_flags =
;    -D DSHOT_PIN=7                ; D8 = Dshot1 connector (default 8 = D9 = Dshot2)
;    -D DSHOT_TELEM_PIN=44         ; D7 = ESC_Telem1 (default 9 = D10 = ESC_Telem2)
;    -D DSHOT_BIDIR=1              ; one-wire eRPM; needs 1k pull-up on the signal line
;    -D DSHOT_MOTOR_POLES=14
;    -D DSHOT_LOOP_HZ=1000
;    -D DSHOT_TELEM_REQ_MS=20      ; request serial telemetry every N ms (default 0 = off)
;    -D DSHOT_MAX_THROTTLE=0.30f   ; bench clamp on |throttle|

; Same test at DShot1200 (src/tests/test_dshot.cpp with -D DSHOT_RATE=DSHOT1200).
; AM32 locks its frame timing at detection, so the ESC needs a signal dropout
; (reflash / unplug) to switch rate; it will not re-sync on the fly.
;   pio run -e test_dshot1200 -t upload && pio device monitor -e test_dshot1200
[env:test_dshot1200]
build_src_filter = +<tests/test_dshot.cpp>
build_flags =
    -D DSHOT_RATE=DSHOT1200
;    -D DSHOT_LOOP_HZ=2000         ; DShot1200 frames are 13 us, 2+ kHz is fine

; CRSF / ELRS receiver check (src/tests/test_crsf_rx.cpp) using lib/AlfredoCRSF.
; Probes the pins for traffic first, then runs the parser and prints channels
; and link statistics. Bench wiring: receiver TX -> GPIO43 (D6), receiver RX <- GPIO6 (D5).
;   pio run -e test_crsf_rx -t upload && pio device monitor -e test_crsf_rx
[env:test_crsf_rx]
build_src_filter = +<tests/test_crsf_rx.cpp>
build_flags =
;    -D CRSF_RX_PIN=43             ; receiver TX -> MCU
;    -D CRSF_TX_PIN=6              ; MCU -> receiver RX
;    -D CRSF_BAUD=420000
;    -D CRSF_AUTO_PINS=0           ; 1 = swap if only the TX pin shows traffic (default)

; PCA9570 I/O expander probe + SK9822 LED blink (src/tests/test_sk9822.cpp).
; The SK9822 clock is the I2C SCL line (GPIO2) through a 74AHCT2G125 gated by
; PCA9570 P0 (low = enabled); data is GPIO40 (MTDO). Both the expander I2C and
; the LED frames are bit-banged on those pins (no I2C driver involved).
;   pio run -e test_sk9822 -t upload && pio device monitor -e test_sk9822
[env:test_sk9822]
build_src_filter = +<tests/test_sk9822.cpp>
build_flags =
;    -D SK_DATA_PIN=40
;    -D SK_BRIGHTNESS=8            ; 0..31 global brightness
;    -D SK_BLINK_MS=1000
;    -D PCA9570_LED_EN_ACTIVE_LOW=1 ; 0 if the gate turns out to be active high

[env:_probe_rail]
build_src_filter = +<tests/_probe_rail.cpp>
