; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; Settings shared by every environment
[env]
; DShotRMT uses the ESP-IDF 5.x RMT driver (driver/rmt_tx.h), which requires
; Arduino-ESP32 core 3.x. The official "espressif32" platform is stuck on core
; 2.x, so use the community-maintained pioarduino platform instead.
; 55.03.312 = Arduino-ESP32 3.3.12 / ESP-IDF 5.5. Requires PlatformIO Core >= 6.2.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Port is auto-detected. On macOS the XIAO shows up as /dev/cu.usbmodem*
; (use cu.*, not tty.*). Uncomment to pin it if more than one board is plugged in.
; upload_port = /dev/cu.usbmodem*
; monitor_port = /dev/cu.usbmodem*

; Main firmware: ESP-IDF (no Arduino). Entry point is app_main() in src/main.c.
; Sources are listed in src/CMakeLists.txt; IDF options in sdkconfig.defaults.
; Only lsm6dsv320x-pid from ./lib is used here; AlfredoCRSF, DShotRMT and
; AlfredoDShot are Arduino libraries and are only usable from Arduino envs.
[env:xiao_esp32s3]
framework = espidf
build_src_filter = +<*> -<tests/>

; LSM6DSV320X I2C bring-up test (src/tests/test_lsm6dsv.cpp)
;   pio run -e test_lsm6dsv -t upload && pio device monitor -e test_lsm6dsv
; Defaults come from include/board_pins.h; override any LSM_* macro here.
[env:test_lsm6dsv]
build_src_filter = +<tests/test_lsm6dsv.cpp>
build_flags =
;    -D LSM_I2C_ADDR=0x6B          ; 0x6A = U5 (default), 0x6B = U4
;    -D LSM_I2C_FREQ_HZ=1000000    ; up to 1 MHz (FM+)
;    -D LSM_INT_OPEN_DRAIN=0       ; 1 = open-drain (default), 0 = push-pull
;    -D LSM_INT_ACTIVE_LOW=0       ; 1 = active-low (default), 0 = active-high
;    -D LSM_SDA_PIN=2              ; defaults from board_pins.h (already
;    -D LSM_SCL_PIN=1              ; account for the crossed U3 wiring)
; Bench rig: SEL is hard-wired low, so don't drive it
    -D LSM_I2C_MUX_SEL_PIN=-1
;    -D LSM_INT_PIN=3

; LSM6DSV320X over hardware SPI at 10 MHz, max ODR (src/tests/test_lsm6dsv_spi.cpp)
;   pio run -e test_lsm6dsv_spi -t upload && pio device monitor -e test_lsm6dsv_spi
; Self-contained: pins/settings are defined in the .cpp, not board_pins.h.
; The IMU's CS must be driven (not tied to 3V3) and SDO/SA0 wired to MISO.
[env:test_lsm6dsv_spi]
build_src_filter = +<tests/test_lsm6dsv_spi.cpp>
build_flags =
;    -D LSM_SPI_SCK_PIN=7          ; D8  (defaults: XIAO labelled SPI pins)
;    -D LSM_SPI_MOSI_PIN=9         ; D10
;    -D LSM_SPI_MISO_PIN=8         ; D9
;    -D LSM_SPI_CS_PIN=44          ; D7
;    -D LSM_SPI_INT_PIN=3          ; D2
;    -D LSM_SPI_CLOCK_HZ=10000000  ; max 10 MHz
;    -D LSM_SPI_MODE=3             ; 0 or 3
;    -D LSM_SPI_USE_INT=1          ; 0 = poll STATUS (default), 1 = read on INT1
;    -D LSM_SPI_INT_OPEN_DRAIN=0   ; 1 = open-drain (default), 0 = push-pull
;    -D LSM_SPI_INT_ACTIVE_LOW=0   ; 1 = active-low (default), 0 = active-high

; I2C line diagnostic (src/tests/diag_i2c_lines.cpp): checks SDA/SCL can be
; pulled low, reads INT, and bit-bang probes addresses without the I2C peripheral.
; Runs at boot and again on any key sent over serial.
;   pio run -e diag_i2c_lines -t upload && pio device monitor -e diag_i2c_lines
[env:diag_i2c_lines]
build_src_filter = +<tests/diag_i2c_lines.cpp>
build_flags =
;    -D DIAG_SDA_PIN=2             ; defaults from board_pins.h
;    -D DIAG_SCL_PIN=1
;    -D DIAG_MUX_SEL_PIN=41        ; drive the mux select (default: not driven)
;    -D DIAG_MUX_SEL_LEVEL=0       ; 0 = IMUs, 1 = external I2C connector
